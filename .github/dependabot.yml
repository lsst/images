version: 2
updates:
  # Each ecosystem batches all its version updates into a single pull request.
  # Security updates are not grouped and still open immediately.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/doc"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-batch:
        patterns:
          - "*"
