[project]
title = "lsst-images"

[project.python]
package = "lsst-images"

[build]
clean = true

[sphinx]
nitpick_ignore = [
  ["py:obj", "lsst.resources.ResourcePathExpression"],  # type alias; not in the pipelines.lsst.io inventory
  ["py:obj", "astropy.io.fits.verify.VerifyWarning"],  # not in the astropy inventory
  ["py:class", "lsst.images._transforms._ast.Mapping"],  # private typing shim over astshim/starlink Ast
]
nitpick_ignore_regex = [
  ['py:.*', 'lsst\.afw(\..*)?'],  # C++ pybind11 API; not in the pipelines.lsst.io inventory
  ['py:.*', 'lsst\.geom(\..*)?'],
  ['py:.*', 'lsst\.meas(\..*)?'],
  ['py:.*', 'lsst\.daf(\..*)?'],
  ['py:.*', 'lsst\.sphgeom(\..*)?'],
  ['py:.*', 'astshim(\..*)?'],
  ['py:class', 'a set-like.*'],  # collections.abc.Mapping inheritance
  ['py:class', 'an object providing.*'],  # collections.abc.Mapping inheritance
]
extensions = [
    "sphinxcontrib.autodoc_pydantic",
    "sphinx_click",
    "documenteer.ext.autotypes"
]

[sphinx.intersphinx.projects]
astropy = "https://docs.astropy.org/en/stable"
lsst = "https://pipelines.lsst.io/v/daily"
numpy = "https://numpy.org/doc/stable/"
python = "https://docs.python.org/3"
pydantic = "https://docs.pydantic.dev/latest/"
piff = "https://rmjarvis.github.io/Piff/_build/html"
astro_metadata_translator = "https://astro-metadata-translator.lsst.io/"
shapely = "https://shapely.readthedocs.io/en/stable/"
h5py = "https://docs.h5py.org/en/stable/"
pytest = "https://docs.pytest.org/en/stable"
